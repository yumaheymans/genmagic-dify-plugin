identity:
  name: generate_video
  author: genmagic
  label:
    en_US: Generate video
    zh_Hans: 生成视频
    ja_JP: 動画を生成
    pt_BR: Gerar vídeo
description:
  human:
    en_US: Create a short video clip from a text description with any text-to-video model GenMagic serves. Waits up to about three minutes for the clip; a longer render returns a job id to finish with Check video.
    zh_Hans: 使用 GenMagic 提供的任一视频模型根据文字描述生成短视频。最多等待约三分钟；渲染更久时返回任务 ID，可用“查询视频”获取结果。
    ja_JP: GenMagic が提供する任意の動画モデルでテキストから短い動画を生成します。最大約 3 分待機し、それ以上かかる場合はジョブ ID を返すので「動画を確認」で結果を取得します。
    pt_BR: Crie um clipe curto a partir de uma descrição com qualquer modelo de vídeo do GenMagic. Aguarda até cerca de três minutos; uma renderização mais longa retorna um ID para concluir com Verificar vídeo.
  llm: Generate a short video from a text description. Returns the video file and its hosted URL when it finishes within about three minutes; otherwise returns a job id and status, and the check_video tool returns the video once it is ready.
parameters:
  - name: prompt
    type: string
    required: true
    label:
      en_US: Prompt
      zh_Hans: 提示词
      ja_JP: プロンプト
      pt_BR: Prompt
    human_description:
      en_US: A description of the video to create.
      zh_Hans: 要生成的视频描述。
      ja_JP: 作成する動画の説明。
      pt_BR: Descrição do vídeo a criar.
    llm_description: A detailed description of the video (subject, action, camera, style).
    form: llm
  - name: model
    type: dynamic-select
    required: false
    default: auto
    label:
      en_US: Model
      zh_Hans: 模型
      ja_JP: モデル
      pt_BR: Modelo
    human_description:
      en_US: The video model to use, listed live from GenMagic with its price per second. Auto lets GenMagic pick.
      zh_Hans: 要使用的视频模型，实时从 GenMagic 获取并显示每秒价格。选择“自动”由 GenMagic 挑选。
      ja_JP: 使用する動画モデル（GenMagic から秒単価付きで取得）。「自動」を選ぶと GenMagic が選択します。
      pt_BR: O modelo de vídeo, listado ao vivo pelo GenMagic com o preço por segundo. Automático deixa o GenMagic escolher.
    llm_description: A GenMagic video model id from the list, or "auto" to let GenMagic choose. Use "auto" unless the user asked for a specific model.
    form: llm
  - name: aspect_ratio
    type: select
    required: false
    default: "16:9"
    label:
      en_US: Aspect ratio
      zh_Hans: 宽高比
      ja_JP: アスペクト比
      pt_BR: Proporção
    human_description:
      en_US: Landscape, portrait or square.
      zh_Hans: 横屏、竖屏或方形。
      ja_JP: 横長、縦長、正方形。
      pt_BR: Paisagem, retrato ou quadrado.
    form: form
    options:
      - value: "16:9"
        label:
          en_US: Landscape (16:9)
          zh_Hans: 横屏 (16:9)
          ja_JP: 横長 (16:9)
          pt_BR: Paisagem (16:9)
      - value: "9:16"
        label:
          en_US: Portrait (9:16)
          zh_Hans: 竖屏 (9:16)
          ja_JP: 縦長 (9:16)
          pt_BR: Retrato (9:16)
      - value: "1:1"
        label:
          en_US: Square (1:1)
          zh_Hans: 方形 (1:1)
          ja_JP: 正方形 (1:1)
          pt_BR: Quadrado (1:1)
  - name: duration
    type: number
    required: false
    min: 1
    max: 20
    label:
      en_US: Duration (seconds)
      zh_Hans: 时长（秒）
      ja_JP: 長さ（秒）
      pt_BR: Duração (segundos)
    human_description:
      en_US: Optional clip length in seconds. Leave empty for the model's default; each model supports its own lengths.
      zh_Hans: 可选，视频时长（秒）。留空使用模型默认值；各模型支持的时长不同。
      ja_JP: 任意。動画の長さ（秒）。空欄ならモデルの既定値。対応する長さはモデルごとに異なります。
      pt_BR: Duração opcional em segundos. Deixe vazio para o padrão do modelo; cada modelo aceita suas próprias durações.
    form: form
extra:
  python:
    source: tools/generate_video.py
